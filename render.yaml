services:
  - type: web
    name: trojan-tester-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: TT_ALLOWED_ORIGINS
        value: "https://aliramezan5.github.io"
      - key: TT_API_TOKEN
        generateValue: true
      - key: TT_RATE_LIMIT
        value: "12"
      - key: TT_MAX_BATCH
        value: "20"
      - key: TT_VERIFY_CONCURRENCY
        value: "4"
      - key: TT_TRUST_PROXY
        value: "false"
