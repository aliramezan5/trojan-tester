name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Verify vendored QR dependency
        run: test "$(git hash-object vendor/qrcode.js)" = '993e88f396640f881b69f98db7a4d17401ef83ca'
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js _site/
          cp -R styles src icons vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
